# ─────────────────────────────────────────────────────────────────────────────
# ConfigMaps — non-sensitive environment configuration
# Secrets are stored in backend-secret / postgres-secret (apply separately)
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: auctionxi
data:
  CORS_ORIGIN: "https://auctionxi.online"   # Replace with actual domain/IP

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: auctionxi
data:
  NEXT_PUBLIC_API_URL: "https://auctionxi.online/api/v1"   # Replace
  NEXT_PUBLIC_WS_URL: "wss://auctionxi.online/ws"             # Replace
