# ─────────────────────────────────────────────────────────────────────────────
# Default values for AuctionXI Helm chart
# Override with: helm upgrade --install auctionxi . -f prod-values.yaml
# ─────────────────────────────────────────────────────────────────────────────

global:
  environment: prod
  domain: ""          # Set to your domain, e.g. "auctionxi.com"
  ecrRegistry: ""     # AWS ECR registry, e.g. "123456789.dkr.ecr.ap-south-1.amazonaws.com"

backend:
  image:
    repository: auctionxi/backend
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    PORT: "8080"
    ENVIRONMENT: production
    JWT_ACCESS_EXPIRY: 24h
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

frontend:
  image:
    repository: auctionxi/frontend
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 10Gi
  storageClass: local-path

redis:
  enabled: true
  image: redis:7-alpine
  storage: 2Gi
  storageClass: local-path
  maxMemory: 128mb

ingress:
  enabled: true
  className: nginx
  tls: false     # Set true when domain + cert-manager are configured
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

monitoring:
  enabled: false   # Enable to deploy Prometheus ServiceMonitor
