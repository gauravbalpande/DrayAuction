# ─────────────────────────────────────────────────────────────────────────────
# NGINX Ingress — Routes all traffic to frontend and backend
#
# Routing rules:
#   /api/*  → backend:8080
#   /ws/*   → backend:8080 (WebSocket upgrade)
#   /*      → frontend:3000
#
# When domain + TLS are configured, uncomment the TLS section.
# cert-manager + Let's Encrypt will auto-issue the certificate.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auctionxi-ingress
  namespace: auctionxi
  annotations:
    # NGINX Ingress controller
    kubernetes.io/ingress.class: "nginx"

    # WebSocket support — critical for auction real-time features
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"

    # Large body for file uploads (if needed)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # Enable CORS at ingress level (backend also handles it)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"

    # HTTP → HTTPS redirect (uncomment when TLS is configured)
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # cert-manager TLS (uncomment when ready)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Rate limiting — 100 req/min per IP
    nginx.ingress.kubernetes.io/limit-rps: "100"

spec:
  # Uncomment and set your domain for TLS:
  # tls:
  #   - hosts:
  #       - your-domain.com
  #       - www.your-domain.com
  #     secretName: auctionxi-tls

  rules:
    # Replace with your actual domain, or leave as-is for IP access
    - host: ""    # Leave empty for IP-only access OR set to "your-domain.com"
      http:
        paths:
          # API routes — go to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080

          # WebSocket routes — go to backend
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080

          # Health check endpoint
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080

          # All other routes — go to frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
